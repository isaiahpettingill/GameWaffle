[package]
name = "gamewaffle-runtime"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
rapier2d = { version = "0.36.1", features = ["enhanced-determinism"] }
ciborium = "0.2.2"
miniz_oxide = "0.8.9"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
wasm-bindgen = "=0.2.105"

[features]
rollback = ["rapier2d/serde-serialize"]

[profile.release]
lto = "thin"
codegen-units = 1
