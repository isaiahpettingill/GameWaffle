[package]
name = "gamewaffle-runtime"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
rapier2d = { version = "0.36.1", features = ["enhanced-determinism"] }
ciborium = "0.2.2"
miniz_oxide = "0.8.9"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_bytes = "0.11"
serde_json = "1"
wasm-bindgen = "=0.2.105"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rustysynth = "=1.3.7"

[target.'cfg(all(any(target_arch = "x86_64", target_arch = "aarch64"), any(target_os = "linux", target_os = "windows", target_os = "macos")))'.dependencies]
cranelift-codegen = "=0.135.1"
cranelift-frontend = "=0.135.1"
cranelift-jit = "=0.135.1"
cranelift-module = "=0.135.1"

[features]
rollback = ["rapier2d/serde-serialize"]

[profile.release]
lto = "thin"
codegen-units = 1
