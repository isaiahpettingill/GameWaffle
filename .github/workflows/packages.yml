name: Build GameWaffle
on:
  push:
    branches: [codex/measure-package-time]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      launch_packages:
        description: Launch the installed desktop apps and the Android emulator
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: rustup target add wasm32-unknown-unknown
      - name: Install matching Wasm tools
        run: |
          curl -fsSL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.105/wasm-bindgen-0.2.105-x86_64-unknown-linux-musl.tar.gz | tar -xz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/wasm-bindgen-0.2.105-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/"

      - run: npm ci --no-audit --no-fund && npm run build
      - uses: actions/upload-artifact@v4
        with: {name: demo-cartridge, path: web-built/demo.waffle, if-no-files-found: error, retention-days: 1, compression-level: 0}
      - run: |
          node packaging/stage.mjs GameWaffle-Studio --android-editor
          tar czf GameWaffle-Android-Studio.tar.gz GameWaffle-Studio
      - uses: actions/upload-artifact@v4
        with: {name: package-Android-Studio, path: GameWaffle-Android-Studio.tar.gz, compression-level: 0, retention-days: 7}
  desktop-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/native-target
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: bash packaging/linux-deps.sh build
      - run: cargo build --manifest-path player/Cargo.toml --features bundled,libretro --release --locked
      - run: cargo build --manifest-path studio/Cargo.toml --release --locked
      - name: Collect native binaries
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            ext=.exe
            lib=main.dll
            platform=windows-x64
          else
            ext=
            lib=libmain.so
            platform=linux-x64
          fi
          python packaging/core-zip.py "native-target/release/$lib" "$platform"
          tar -czf desktop-native.tgz "GameWaffle-Libretro-$platform.zip" -C native-target/release "gamewaffle-player$ext" "gamewaffle-studio$ext"
      - uses: actions/upload-artifact@v4
        with: {name: 'desktop-native-${{ runner.os }}', path: desktop-native.tgz, compression-level: 0, retention-days: 1}
  desktop:
    needs: [studio, desktop-native]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/download-artifact@v4
        with: {name: package-Android-Studio}
      - uses: actions/download-artifact@v4
        with: {name: 'desktop-native-${{ runner.os }}'}
      - if: runner.os == 'Linux'
        run: bash packaging/linux-deps.sh package ${{ inputs.launch_packages && '--launch' || '' }}
      - name: Assemble Studio
        shell: bash
        run: |
          mkdir stage
          tar -xzf GameWaffle-Android-Studio.tar.gz -C stage --strip-components=1
          tar -xzf desktop-native.tgz -C stage
          mv stage/GameWaffle-Libretro-*.zip .
          node packaging/stage.mjs stage --desktop-only
      - name: Stage standalone runtime
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp stage/gamewaffle-player.exe GameWaffle-Player-windows-x64.exe
          else
            cp stage/gamewaffle-player GameWaffle-Player-linux-x64
          fi
      - if: runner.os == 'Linux'
        run: |
          cp packaging/{AppRun,gamewaffle.desktop,gamewaffle.svg} stage/
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o tool
          chmod +x tool
          ARCH=x86_64 ./tool --appimage-extract-and-run stage GameWaffle-x86_64.AppImage
          SDL_VIDEO_DRIVER=dummy SDL_AUDIO_DRIVER=dummy ./GameWaffle-x86_64.AppImage --appimage-extract-and-run --player --verify stage/web-built/demo.waffle
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" packaging\windows.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch the installed Windows apps
        if: runner.os == 'Windows' && inputs.launch_packages
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP gw-installed
          $install = Start-Process -Wait -PassThru .\GameWaffle-Setup.exe -ArgumentList "/S", "/D=$target"
          if ($install.ExitCode) { throw "Installer failed" }
          $studio = Start-Process -PassThru "$target\gamewaffle-studio.exe"
          try {
            $deadline = (Get-Date).AddSeconds(45)
            while (!$studio.HasExited -and !$studio.MainWindowHandle -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $studio.Refresh()
            }
            if (!$studio.MainWindowHandle) { throw "Studio did not open a window" }
          } finally { if (!$studio.HasExited) { Stop-Process -Id $studio.Id } }
          $env:SDL_VIDEO_DRIVER = "dummy"
          $env:SDL_AUDIO_DRIVER = "dummy"
          & "$target\gamewaffle-player.exe" --verify "$target\web-built\demo.waffle"
          if ($LASTEXITCODE) { throw "Installed player failed" }
      - name: Launch the Linux Studio AppImage
        if: runner.os == 'Linux' && inputs.launch_packages
        run: |
          xvfb-run -a bash -ec '
            ./GameWaffle-x86_64.AppImage --appimage-extract-and-run &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            timeout 45 xdotool search --sync --onlyvisible --name "GameWaffle Studio"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            GameWaffle-Libretro-*.zip
            GameWaffle-Player-*
            GameWaffle-Setup.exe
            GameWaffle-x86_64.AppImage
  android-native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {abi: arm64-v8a, target: aarch64-linux-android}
          - {abi: x86_64, target: x86_64-linux-android}
    steps:
      - uses: actions/checkout@v4
      - name: Build one Android architecture
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          if [[ ! -d "$ANDROID_NDK_HOME/toolchains/llvm" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          fi
          rustup target add "${{ matrix.target }}"
          export SDL_SOURCE="$RUNNER_TEMP/SDL"
          git clone --depth 1 --branch release-3.4.2 https://github.com/libsdl-org/SDL.git "$SDL_SOURCE"
          BUILD_LIBRETRO=1 bash player/android/build-native.sh "${{ matrix.abi }}"
          tar -czf native-${{ matrix.abi }}.tgz web-built/android/build/lib/${{ matrix.abi }} GameWaffle-Libretro-android-${{ matrix.abi }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.abi }}
          path: native-${{ matrix.abi }}.tgz
          compression-level: 0
          retention-days: 1
  android:
    needs: [studio, android-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: actions/download-artifact@v4
        with: {name: demo-cartridge, path: web-built}
      - uses: actions/download-artifact@v4
        with: {pattern: native-*, merge-multiple: true}
      - name: Prepare APK inputs
        run: |
          for abi in arm64-v8a x86_64; do tar -xzf "native-$abi.tgz"; done
          packages=()
          [[ -f "$ANDROID_HOME/platforms/android-35/android.jar" ]] || packages+=("platforms;android-35")
          [[ -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]] || packages+=("build-tools;35.0.0")
          if (( ${#packages[@]} )); then "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${packages[@]}"; fi
          git clone --depth 1 --filter=blob:none --sparse --branch release-3.4.2 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          git -C "$RUNNER_TEMP/SDL" sparse-checkout set android-project/app/src/main/java
      - name: Build and verify APK
        env:
          SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_SIGNING || '' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            : "${SIGNING:?Configure the ANDROID_SIGNING repository secret}"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.p12"
            umask 077
            jq -er .key <<<"$SIGNING" | base64 -d > "$ANDROID_KEYSTORE"
            GW_KEY_PASSWORD=$(jq -er .password <<<"$SIGNING")
            export GW_KEY_PASSWORD
            unset SIGNING
            trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
          fi
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_PLATFORM_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          export RELEASE_VERSION_CODE="$GITHUB_RUN_NUMBER" RELEASE_VERSION_NAME="${GITHUB_REF_NAME#v}"
          export SDL_SOURCE="$RUNNER_TEMP/SDL"
          USE_PREBUILT_ANDROID_LIBS=1 bash player/android/build.sh web-built/demo.waffle GameWaffle-Player.apk
      - if: inputs.launch_packages
        run: |
          if [[ ! -d "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          fi
      - name: Enable emulator acceleration
        if: inputs.launch_packages
        run: sudo chmod a+rw /dev/kvm
      - name: Launch the Android APK and core
        if: inputs.launch_packages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" ANDROID_NDK_LATEST_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash packaging/check-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: package-Android
          compression-level: 0
          retention-days: 7
          path: |
            GameWaffle-Player.apk
            GameWaffle-Libretro-android-*.zip
  release:
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions: {contents: write, id-token: write, attestations: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'package-*', merge-multiple: true, path: dist}
      - uses: actions/attest-build-provenance@v3
        with: {subject-path: 'dist/*'}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
