[package]
name = "gamewaffle-player"
version = "0.1.0"
edition = "2024"

[lib]
name = "main"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "gamewaffle-player"
path = "src/main.rs"

[dependencies]
gamewaffle-runtime = { path = "../runtime" }
ciborium = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
png = "0.18"
symphonia = { version = "0.5", default-features = false, features = ["ogg","vorbis","wav","pcm"] }
qoa = "1.0.1"
sdl3 = "=0.22.1"
opus-decoder = "0.1.1"
ogg = "0.8"
self_cell = { version = "1", optional = true }

[features]
bundled = ["sdl3/build-from-source-static"]
libretro = ["dep:self_cell", "sdl3/static-link", "gamewaffle-runtime/rollback"]

[profile.release]
lto = "thin"
codegen-units = 1

[build-dependencies]
embed-resource = "3.0.12"
